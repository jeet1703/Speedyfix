server:
  port: ${PORT:8080}
  # Render sits behind a proxy: use its X-Forwarded-* headers for https links and the client address.
  forward-headers-strategy: framework
  # Gzip the JSON (shop pages are 5 to 20 KB, a few KB compressed).
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,image/svg+xml,text/plain
    min-response-size: 1024

spring:
  # The database is off unless the "postgres" profile is active (application-postgres.yml), so the site still runs
  # where no database exists yet. Turn it on with SPRING_PROFILES_ACTIVE=postgres.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB

site:
  name: SpeedyFix Auto Sales
  # The shop's public address, for the sitemap: https://www.speedyfixautosales.com once it's on its own domain.
  public-url: ${SITE_URL:https://jeet1703.github.io/Speedyfix}
  tagline: House of quality spare parts
  phone: "+44 7707 704977"
  whatsapp: "+44 7707 704977"
  email: "eBay.speedyfix@gmail.com"
  company-name: "SpeedyFix Auto Sales Ltd"
  address: "Unit 2E, Tomo Industrial Estate, Packet Boat Lane, Uxbridge, Middlesex, UB8 2JP"
  vat-number: "GB 508552979"
  # Companies House registration number
  company-number: "16664355"
  # Set to a YouTube embed URL (https://www.youtube.com/embed/<id>) once the client supplies the video.
  video-url: ""
  # Shown on every product page. Confirm the warranty terms and dispatch location with the client.
  warranty: "28-day"
  ships-from: "Uxbridge, UK"
  couriers: "FedEx, UPS, Royal Mail, DHL and DPD"
  returns: "Returns accepted within 30 days of delivery (your legal right to cancel is 14 days). Parts must come back in the condition we supplied them; if a part has been fitted, used or tested beyond what's needed to inspect it, the refund may be reduced by up to 30%."
  cors-allowed-origins:
    - http://localhost:5173
    # A second local dev server takes 5174 when 5173 is busy.
    - http://localhost:5174
    - https://jeet1703.github.io

admin:
  # Master staff sign-in. Set ADMIN_PASSWORD (12+ characters) as a secret; without it the admin can't be signed in to.
  email: ${ADMIN_EMAIL:prabhjeetsinghhh@gmail.com}
  password: ${ADMIN_PASSWORD:}
  name: ${ADMIN_NAME:Master admin}
  # Signs the staff JWTs (32+ characters, a secret). Without it a random key is used, so a restart signs everyone out.
  jwt-secret: ${ADMIN_JWT_SECRET:}
  # Starting values for the Settings page. Staff can change them there (kept in the database once saved).
  lookup-cost: ${ADMIN_LOOKUP_COST:0}
  lookup-budget: ${ADMIN_LOOKUP_BUDGET:0}
  buying-team-email: ${ADMIN_BUYING_TEAM_EMAIL:}

account:
  # Shopper sign-in with Google. GOOGLE_CLIENT_ID is the OAuth web client id from Google Cloud Console
  # (it isn't secret, so the business's client id is the default). Blank switches the Google button off.
  google-client-id: ${GOOGLE_CLIENT_ID:1077960801718-u7b9qn4nbcbhhu12s9s4c0bt7qc7b5cu.apps.googleusercontent.com}
  # Signs shopper session tokens (32+ characters, a secret). Without it a random key is used, so a restart signs shoppers out.
  jwt-secret: ${ACCOUNT_JWT_SECRET:}

photos:
  # Where listing photos are stored on this computer (storage/ in the project when the backend runs from backend/).
  dir: ${PHOTOS_DIR:../storage}
  # Set to https://images.<domain> once photos are served from Cloudflare R2; empty serves them from /api/images.
  base-url: ${IMAGES_BASE_URL:}
  # Cloudflare R2 bucket for listing photos (needed live: Render's disk is wiped on restart). The bucket can stay
  # private; the server serves the photos. Secret: set them in the environment, never in this file.
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:speedyfix-images}

ebay:
  # eBay developer keys (Production keyset) for the Browse API, used by the eBay import for photos and item specifics.
  # Secret: set them in the environment, never in this file.
  client-id: ${EBAY_CLIENT_ID:}
  client-secret: ${EBAY_CLIENT_SECRET:}
  marketplace: EBAY_GB
  # With the keys set, the shop follows the seller's eBay listings: new listings are added (with photos), prices
  # follow eBay, and parts no longer on eBay are ended. EBAY_SELLER is found from the listings when left blank.
  seller: ${EBAY_SELLER:}
  sync: ${EBAY_SYNC:true}
  sync-interval: ${EBAY_SYNC_INTERVAL:PT30M}

paypal:
  # PayPal Checkout (PayPal, or debit/credit card through PayPal). REST app keys from developer.paypal.com,
  # Apps & Credentials. Secret: set them in the environment, never in this file. PAYPAL_ENVIRONMENT is "sandbox"
  # (test money) or "live".
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  environment: ${PAYPAL_ENVIRONMENT:sandbox}

gemini:
  # The help chat's AI answers (Google Gemini). Without a key the chat still works, answering by itself.
  # Secret: set it in the environment, never in this file. GEMINI_MODELS are tried in order when one is busy.
  api-key: ${GEMINI_API_KEY:}
  models: ${GEMINI_MODELS:gemini-3.5-flash,gemini-3.5-flash-lite}

orders:
  # With PayPal set up, an order left unpaid this long is cancelled and its parts go back on sale. PT0S: never.
  unpaid-expiry: ${ORDERS_UNPAID_EXPIRY:PT2H}

dvsa:
  # DVSA MOT History API (free) for real plate lookups. All four come from DVSA's registration email; until they're
  # set, the site uses the demo plates. Secret: set them in the environment, never in this file.
  client-id: ${DVSA_CLIENT_ID:}
  client-secret: ${DVSA_CLIENT_SECRET:}
  api-key: ${DVSA_API_KEY:}
  # https://login.microsoftonline.com/<tenant id>/oauth2/v2.0/token (the tenant id is in the email)
  token-url: ${DVSA_TOKEN_URL:}
