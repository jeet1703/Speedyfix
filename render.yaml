services:
  - type: web
    name: speedyfix-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Starter doesn't sleep: on the free plan the shop's API (and the eBay sync) stops after 15 idle minutes.
    plan: starter
    region: frankfurt
    healthCheckPath: /api/site
    autoDeploy: true
    # Only redeploy when backend code changes, not on frontend pushes.
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Staff sign-in password (12+ characters). Set it in the Render dashboard; it isn't stored in the repo.
      - key: ADMIN_PASSWORD
        sync: false
      # Master admin email (defaults to the one in application.yml if left unset).
      - key: ADMIN_EMAIL
        sync: false
      # Signs staff JWTs, so sessions survive a redeploy. Render generates a random value.
      - key: ADMIN_JWT_SECRET
        generateValue: true
      # Shopper sign-in with Google: the OAuth web client id from Google Cloud Console (not secret).
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Signs shopper session tokens, so shoppers stay signed in across redeploys. Render generates a random value.
      - key: ACCOUNT_JWT_SECRET
        generateValue: true
      # PostgreSQL: "postgres" switches the shop from the built-in sample catalogue to the database.
      - key: SPRING_PROFILES_ACTIVE
        sync: false
      # jdbc:postgresql://<internal host>:5432/<database> from the database's Connect panel. Set in the dashboard only.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # DVSA MOT History API for real number plate lookups (all four from DVSA's approval email). Without them the
      # site uses demo plates.
      - key: DVSA_CLIENT_ID
        sync: false
      - key: DVSA_CLIENT_SECRET
        sync: false
      - key: DVSA_API_KEY
        sync: false
      - key: DVSA_TOKEN_URL
        sync: false
      # Cloudflare R2 bucket for listing photos (Render's disk is wiped on restart). R2_BUCKET defaults to speedyfix-images.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # eBay Production keyset, for the photo import and stock sync.
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      # PayPal Checkout. PAYPAL_ENVIRONMENT: sandbox (test money) or live.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENVIRONMENT
        sync: false
      # FedEx delivery prices at checkout (optional: without them the flat delivery prices apply).
      - key: FEDEX_API_KEY
        sync: false
      - key: FEDEX_SECRET_KEY
        sync: false
      - key: FEDEX_ACCOUNT_NUMBER
        sync: false
      # "live" with production keys. Never put the sandbox (test) keys on the live site: they show test prices.
      - key: FEDEX_ENVIRONMENT
        sync: false
      # Order emails through Resend: the buyer's VAT invoice, and a copy to staff (optional: without the key, invoices
      # are still on the order page). MAIL_FROM must be on the domain verified in Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "SpeedyFix Auto Sales <orders@speedyfixautosales.com>"
      - key: MAIL_STAFF_ORDERS
        sync: false
      # Google Gemini for the help chat's AI answers (optional: without it the chat answers by itself).
      - key: GEMINI_API_KEY
        sync: false
      # The shop's public address, for the sitemap (https://www.speedyfixautosales.com once the domain is set up).
      - key: SITE_URL
        sync: false
      # The shop's address(es), comma-separated: the only sites allowed to call this API from a browser
      # (site.cors-allowed-origins). e.g. https://speedyfix-frontend.onrender.com,https://www.speedyfixautosales.com
      - key: SITE_CORSALLOWEDORIGINS
        sync: false
      # "false" stops the 30-minute eBay sync, e.g. while an old copy of the backend still runs on the same database.
      - key: EBAY_SYNC
        sync: false

  # The shop and admin: the React app, built and served from Render's CDN. Every page path goes to index.html,
  # where the app's router takes over (/products/..., /checkout, /admin/...).
  - type: web
    name: speedyfix-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    buildFilter:
      paths:
        - frontend/**
    routes:
      # The sitemap is built by the backend from the live catalogue; served here so it's on the shop's own domain.
      # Must come before the /* rule. Update the address if the backend's changes.
      - type: rewrite
        source: /sitemap.xml
        destination: https://speedyfix-backend-dzgw.onrender.com/sitemap.xml
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Built files have a content hash in their name, so they can be cached for good; index.html isn't, so a
      # deploy shows straight away.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    envVars:
      # The backend's address, from its page in Render (e.g. https://speedyfix-backend.onrender.com). It's built into
      # the app, so redeploy this site after changing it.
      - key: VITE_API_URL
        sync: false
