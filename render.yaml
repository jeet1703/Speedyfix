services:
  - type: web
    name: speedyfix-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/site
    autoDeploy: true
    # Only redeploy when backend code changes, not on frontend pushes.
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Staff sign-in password (12+ characters). Set it in the Render dashboard; it isn't stored in the repo.
      - key: ADMIN_PASSWORD
        sync: false
      # Master admin email (defaults to the one in application.yml if left unset).
      - key: ADMIN_EMAIL
        sync: false
      # Signs staff JWTs, so sessions survive a redeploy. Render generates a random value.
      - key: ADMIN_JWT_SECRET
        generateValue: true
      # Shopper sign-in with Google: the OAuth web client id from Google Cloud Console (not secret).
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Signs shopper session tokens, so shoppers stay signed in across redeploys. Render generates a random value.
      - key: ACCOUNT_JWT_SECRET
        generateValue: true
      # PostgreSQL: "postgres" switches the shop from the built-in sample catalogue to the database.
      - key: SPRING_PROFILES_ACTIVE
        sync: false
      # jdbc:postgresql://<internal host>:5432/<database> from the database's Connect panel. Set in the dashboard only.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # DVSA MOT History API for real number plate lookups (all four from DVSA's approval email). Without them the
      # site uses demo plates.
      - key: DVSA_CLIENT_ID
        sync: false
      - key: DVSA_CLIENT_SECRET
        sync: false
      - key: DVSA_API_KEY
        sync: false
      - key: DVSA_TOKEN_URL
        sync: false
